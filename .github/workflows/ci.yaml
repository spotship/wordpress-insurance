name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer exec -- phpcs
      - run: composer exec -- phpstan analyse --memory-limit=1G

  unit:
    name: PHPUnit unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer exec -- phpunit --testsuite unit

  front-end:
    # Deliberately its OWN job, not folded into e2e. This suite needs no browser
    # and no Docker, so it must stay green even on a runner where Playwright
    # cannot start — which is exactly the situation that made it worth writing.
    name: Front-end (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:js

  version:
    name: Version header matches constant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/assert-version.sh

  integration:
    name: PHPUnit integration (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npx wp-env start
      - run: |
          npx wp-env run tests-cli \
            --env-cwd=wp-content/plugins/$(basename "$PWD") \
            vendor/bin/phpunit --testsuite integration

  e2e:
    # ⛔ Gated on ENG-6418. These specs are committed but have never executed —
    # Playwright's runner does not start on the development machine, and until
    # this job has run green NO WCAG 2.1 AA CONFORMANCE CLAIM can be made.
    name: Playwright + axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx wp-env start
      - run: bash bin/seed-e2e.sh
      - run: npx playwright test
