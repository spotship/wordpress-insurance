name: Real backend E2E

# DELIBERATE ONLY, and never on a pull request.
#
# This is the only suite that talks to the real API. It needs a live credential
# and it writes real records, so it must not be reachable from a fork, a
# pull_request event, or an ordinary push.
#
# TWO TRIGGERS, BECAUSE workflow_dispatch ALONE CANNOT REACH A NEW WORKFLOW.
#
# GitHub only offers `workflow_dispatch` for workflow files that exist on the
# DEFAULT branch. This file has never been on `dev`, so dispatching it answers
# `HTTP 404: workflow not found` and the suite was unrunnable until the very
# pull request that introduces it had merged — a suite that cannot run until
# after the review it is meant to inform.
#
# A `push` event reads the workflow from the ref that was pushed, so a tag
# reaches it on any branch. `real-backend-*` is not an ordinary push: creating
# and pushing that tag is an explicit act by someone with write access, it
# cannot come from a fork, and it names the run in the tag itself. The
# no-automatic-trigger property is intact — there is still no path from a code
# push or a pull request to this job.
#
#   git tag real-backend-$(date +%Y%m%d-%H%M) && git push origin --tags
#
# THE WRITING TESTS ARE OPT-IN, AND THAT IS NOT TIMIDITY.
#
# Two tests submit a valid payload from a correctly-bound site, so two create
# real QuoteRequest rows — and the backend fires a referral EMAIL and a SLACK
# post for every row it stores. notifications.py posts to
# INSURANCE_REFERRAL_WEBHOOK_URL, which its own docblock says is the same
# Workflow Builder workflow the serica referral views use. A test submission can
# therefore arrive in front of whoever reads that channel looking exactly like a
# real insurance enquiry, and the row cannot be un-sent.
#
# Everything else in the suite is read-only against the real deployment: real
# autocomplete, real rate data, axe on the real table, a real 401 from real
# authentication, a real DNS failure, the origin-binding refusal, and the
# no-JavaScript case. Those need no permission from anyone, so they are the
# default and the writing pair is held behind `writes`.
#
# A tag run is read-only. Use workflow_dispatch with writes=true when the
# referral destinations have been confirmed and somebody is watching them.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run is being made (recorded in the evidence)'
        required: true
        default: 'Verify ENG-5587 against the real backend'
      writes:
        description: 'Also run the two tests that create real quote rows (fires referral email + Slack)'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'real-backend-*'

concurrency:
  # Never two at once: concurrent runs would interleave submissions and make
  # the resulting records ambiguous about which run produced them.
  group: real-backend-e2e
  cancel-in-progress: false

jobs:
  real-backend:
    name: Real backend
    runs-on: ubuntu-latest
    # DECLARING THE ENVIRONMENT IS WHAT MAKES THE SECRETS RESOLVE.
    #
    # SPOTSHIP_API_URL/KEY are environment secrets: the same two names hold the
    # dev values here and the prod values in release.yaml. One name per value,
    # the environment says which deployment - rather than a DEV_/PROD_ prefix
    # pair that has to be kept in step by hand. A job that does not name an
    # environment sees only repository and organisation secrets, so removing
    # this line makes both empty and the guard below fails the run.
    #
    # `dev`, not `staging`: the org names its deployments dev and prod
    # throughout - backend-dev.spot-ship-app.com, flower-dev, entity-search-dev,
    # dev.spotship.internal. This file said `staging`, which named no real
    # environment.
    environment: dev
    steps:
      - uses: actions/checkout@v4

      # FAIL LOUDLY RATHER THAN SKIP. A job that silently passes because its
      # secrets are absent is worse than no job: it reports green for a suite
      # that never ran, which is the exact failure this whole ticket has been
      # about.
      - name: Require credentials
        env:
          URL: ${{ secrets.SPOTSHIP_API_URL }}
          KEY: ${{ secrets.SPOTSHIP_API_KEY }}
        run: |
          missing=""
          [ -n "$URL" ] || missing="$missing SPOTSHIP_API_URL"
          [ -n "$KEY" ] || missing="$missing SPOTSHIP_API_KEY"

          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s) on the 'dev' environment:$missing"
            echo "This suite verifies persistence, attribution and consent provenance"
            echo "against the real backend. It cannot be faked, and it must not pass"
            echo "without running."
            echo
            echo "These are ENVIRONMENT secrets on 'dev', not repository secrets:"
            echo "  gh secret set SPOTSHIP_API_URL --env dev"
            echo "    https://backend-dev.spot-ship-app.com/api"
            echo "  gh secret set SPOTSHIP_API_KEY --env dev"
            echo "    a Customer.api_key uuid, minted in the dev Django admin"
            echo
            echo "SPOTSHIP_API_URL is the BASE, ending at /api - the same value the"
            echo "plugin stores in api_base_url. The endpoint paths are appended by"
            echo "the code, not baked into the secret. Confirm a candidate with:"
            echo "  curl -s -o /dev/null -w '%{http_code}' \\"
            echo "    https://backend-dev.spot-ship-app.com/api/insurance/rates/"
            echo "401 means the endpoint is there and wants a key; 404 means the"
            echo "base is wrong."
            exit 1
          fi

      # WHAT DOES THE DEPLOYMENT ACTUALLY ANSWER? ASK BEFORE THE BROWSER DOES.
      #
      # The first real run failed with "the real backend returned no locations
      # for rotterdam", and that message cannot tell you WHY: an empty search
      # index, a 403 on a key without search entitlement, and a 503 from
      # OpenSearch all look identical from inside a combobox. The artifact that
      # would have said is only reachable by downloading it.
      #
      # So the facts go in the JOB LOG, before anything else runs. This is the
      # same move ci.yaml makes for the stand-in upstream, where three specs
      # once failed on a missing aria-activedescendant that was really an
      # unreachable host.
      #
      # The key is passed as a header from the environment and never echoed;
      # only the status and the result COUNT are printed.
      - name: What does the dev backend answer?
        env:
          URL: ${{ secrets.SPOTSHIP_API_URL }}
          KEY: ${{ secrets.SPOTSHIP_API_KEY }}
        run: |
          set -uo pipefail

          RATES_STATUS=""
          BROKEN=""

          probe() {
            local label="$1" path="$2"
            local body status title

            body=$( curl -sS --max-time 20 -w '\n%{http_code}' \
              -H "Authorization: Bearer ${KEY}" \
              -H 'Accept: application/json' \
              "${URL%/}/${path}" 2>/dev/null ) || {
                echo "  $label: request failed outright"
                return
              }

            status=$( printf '%s' "$body" | tail -n1 )
            body=$( printf '%s' "$body" | sed '$d' )

            # A count, not the payload: these are commercial figures and
            # customer-facing records, and the job log is not the place for them.
            echo "  $label: HTTP $status, $( printf '%s' "$body" | head -c 200000 | grep -o '"id"' | wc -l | tr -d ' ' ) object(s) with an id, $( printf '%s' "$body" | wc -c | tr -d ' ' ) bytes"

            # NAME THE FAULT WITHOUT DUMPING THE BODY. With DEBUG on, a Django
            # error page carries settings and local variables, and a public job
            # log is the wrong place for them.
            #
            # Django's debug page puts "ExceptionType at /path" in its <title>.
            # The 500s seen so far carry no <title> at all, so the fallback
            # reports which known marker the body matches — enough to tell a
            # debug traceback from a plain error page from a proxy's own page,
            # which is what decides where to go looking.
            if [ "$status" -ge 500 ]; then
              title=$( printf '%s' "$body" | tr -d '\n' | sed -n 's/.*<title>\(.*\)<\/title>.*/\1/p' | head -c 200 )

              if [ -n "$title" ]; then
                echo "  $label: ^ $title"
              else
                marker="unrecognised body"
                printf '%s' "$body" | grep -qi 'Traceback'        && marker="Django debug traceback (DEBUG is on)"
                printf '%s' "$body" | grep -qi 'Server Error (500)' && marker="Django 500 page (DEBUG is off)"
                printf '%s' "$body" | grep -qi 'nginx'            && marker="nginx error page — did not reach Django"
                printf '%s' "$body" | grep -qi '502 Bad Gateway'  && marker="502 from a proxy — Django did not answer"
                echo "  $label: ^ $marker, no <title>"
              fi
            fi

            [ "$label" = "rates          " ] && RATES_STATUS="$status"

            # ANY 5xx is the deployment's problem, not this plugin's, whichever
            # endpoint it came from. The run before this one had all three
            # failing; the one after it had only vessel_search, and the browser
            # suite reported that as "the real vessel search returned nothing
            # for ever" — a sentence that sounds like missing data and is not.
            [ "$status" -ge 500 ] && BROKEN="$BROKEN $( echo "$label" | tr -d ' ' )($status)"

            return 0
          }

          echo "--- the endpoints this suite depends on"
          probe "rates          " "insurance/rates/"
          probe "location_search" "insurance/location_search/?query=rotterdam"
          probe "vessel_search  " "insurance/vessel_search/?query=ever"
          echo

          # STOP HERE IF THE DEPLOYMENT IS NOT SERVING.
          #
          # Every spec in this suite talks to these endpoints, so letting the
          # browser run against a broken deployment produces ten failures that
          # all describe symptoms — "the real backend returned no locations for
          # rotterdam" — and none that name the cause. One accurate failure
          # beats ten misleading ones.
          #
          # `rates/` is the right canary: it builds a static payload and touches
          # neither the search index nor the database, so anything other than
          # 200 from it is about the deployment, not the data.
          case "$RATES_STATUS" in
            200)
              echo "rates/ is serving, so the deployment itself is up."
              ;;
            401|403)
              echo "::error::The dev key was rejected (HTTP $RATES_STATUS)."
              echo "SPOTSHIP_API_KEY on the 'dev' environment is wrong, revoked, or"
              echo "belongs to a Customer that is no longer active."
              exit 1
              ;;
            *)
              echo "::error::The dev deployment answered HTTP $RATES_STATUS on insurance/rates/."
              echo
              echo "This is a BACKEND problem, not a plugin one. rates/ returns a"
              echo "static payload — no search index, no quote tables — so a 5xx"
              echo "from it means the request never got as far as this plugin's"
              echo "concerns. Note that the same endpoint answers 401 cleanly"
              echo "WITHOUT a key, so authentication is reached and it is what"
              echo "happens after it that fails."
              echo
              echo "Worth checking on the dev deployment: whether ENG-5586's"
              echo "migrations are applied, and whether the cache backend DRF's"
              echo "ScopedRateThrottle depends on is reachable — a throttle that"
              echo "cannot reach its cache raises, and every one of these"
              echo "endpoints is scoped-throttled."
              exit 1
              ;;
          esac

          # rates/ being healthy is not the whole story: the endpoints are
          # backed by different indexes and fail independently.
          if [ -n "$BROKEN" ]; then
            echo
            echo "::error::Endpoint(s) answering 5xx on the dev deployment:$BROKEN"
            echo
            echo "A 5xx is the deployment's problem and not this plugin's, and"
            echo "running the browser suite on top of one produces failures that"
            echo "describe symptoms instead. \"The real vessel search returned"
            echo "nothing for 'ever'\" reads as missing data; it is a 500."
            echo
            echo "location_search and vessel_search are separate indexes behind"
            echo "separate entity_search viewsets, so one can be healthy while"
            echo "the other is not. Check the index backing the failing one."
            exit 1
          fi

          echo "All probed endpoints answered 2xx. Any empty result below is"
          echo "about the data in the dev index, not about reachability."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run against the real backend
        env:
          # The specs read SPOTSHIP_API_URL/KEY; bin/seed-e2e.sh reads
          # SPOTSHIP_UPSTREAM/SPOTSHIP_API_KEY. Setting all three here rather
          # than re-exporting them inline keeps the credential out of the
          # shell's argument list.
          #
          # Seeded against the REAL endpoint, so no stand-in is involved and no
          # mu-plugin host allowance is needed: the dev deployment is a public
          # host.
          SPOTSHIP_API_URL: ${{ secrets.SPOTSHIP_API_URL }}
          SPOTSHIP_API_KEY: ${{ secrets.SPOTSHIP_API_KEY }}
          SPOTSHIP_UPSTREAM: ${{ secrets.SPOTSHIP_API_URL }}
          REASON: ${{ inputs.reason || format('pushed tag {0}', github.ref_name) }}
          WRITES: ${{ inputs.writes }}
        run: |
          set -euo pipefail

          npx wp-env start
          bash bin/seed-e2e.sh

          # Read-only unless explicitly asked for: @writes marks the two tests
          # that store a row and trigger a referral email and Slack post.
          if [ "${WRITES:-false}" = "true" ]; then
            echo "including the writing tests — real rows and real referrals will be created"
            npx playwright test --config=playwright.real-backend.config.js
          else
            echo "read-only run — skipping @writes"
            npx playwright test --config=playwright.real-backend.config.js --grep-invert @writes
          fi

      - name: Record what was run
        if: always()
        env:
          REASON: ${{ inputs.reason || format('pushed tag {0}', github.ref_name) }}
        run: |
          mkdir -p real-backend-evidence
          {
            echo "# Real backend E2E evidence"
            echo
            echo "- Reason: ${REASON}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- When:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## What this run does and does not prove"
            echo
            echo "PROVES: both products submit through the shortcode AND through"
            echo "Elementor; the row persists; and the stored row carries source,"
            echo "originSiteUrl, consentText, consentGivenAt and dataConsent."
            echo "Persistence is read back server-side by replaying the submissionId,"
            echo "which the API answers with the ORIGINAL row. A 201 there would mean"
            echo "the first submission never persisted."
            echo
            echo "ALSO PROVES, against the real deployment rather than a stand-in:"
            echo "  - autocomplete resolves real vessels and locations, and the id"
            echo "    committed is the id of the option displayed"
            echo "  - axe is clean on the REAL rate table (15 hull zones and 6 cargo,"
            echo "    not the stand-in's single row) on both products"
            echo "  - an unreachable backend refuses rather than reporting sent, and"
            echo "    blocks submission rather than showing an empty search"
            echo "  - a site bound elsewhere cannot submit, and the one-click re-bind"
            echo "    restores submission — not merely the notice"
            echo "  - with JavaScript blocked the form is inert and says why, while"
            echo "    still serving the real rate table"
            echo
            echo "DOES NOT PROVE: that the referral email or the Slack message fired."
            echo "backend/insurance/notifications.py dispatches both fire-and-forget"
            echo "and records no flag, so nothing in the API can be asked. Confirming"
            echo "them needs the dev mailbox and the Slack channel. Check both by"
            echo "hand for the markers in the receipts above, and note that a REPLAY"
            echo "deliberately does not re-send either."
          } > real-backend-evidence/RUN.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-backend-evidence
          path: |
            real-backend-evidence/
            real-backend-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
