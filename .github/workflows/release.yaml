name: Release

# THE BY-HAND PATH. The automated one is semantic-release.yaml.
#
# An automated release does NOT come through here. A tag pushed by a job using
# GITHUB_TOKEN does not start another workflow — GitHub suppresses that
# deliberately, to stop workflows triggering themselves forever — so the
# `push: tags` trigger below never fires for a tag semantic-release created.
# semantic-release therefore builds the zip in its own `prepare` step and
# attaches it as part of publishing the release, which also means a failed build
# aborts before anything is published rather than leaving a release with no
# asset. Both paths run the same two scripts, so there is one build chain, not
# two that drift.
#
# What is left for this workflow is the manual cases: someone pushes a version
# tag by hand, or re-attaches a zip to a release whose build failed.
#
# THE MANUAL TRIGGER MUST NAME A TAG. Without an input, `inputs.tag` is empty on
# a workflow_dispatch, so the checkout takes the selected BRANCH and
# action-gh-release falls back to `github.ref_name` — publishing a release
# literally tagged `main`, built from a tree that is not any released version.
# The branch picker GitHub shows for a manual run selects which copy of this
# file to run, not what to build; `tag` is what to build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and attach the zip to, e.g. v1.2.3.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and publish the plugin zip
    runs-on: ubuntu-latest
    # DECLARING THE ENVIRONMENT IS WHAT MAKES THE SECRETS RESOLVE.
    #
    # SPOTSHIP_API_URL/KEY are environment secrets, not repository secrets:
    # the same two names hold the prod values here and the dev values in
    # real-backend-e2e.yaml. A job that does not name an environment sees only
    # repository and organisation secrets, so removing this line makes both
    # values empty and the rate fetch below fails.
    #
    # `prod`, not `production`: the org names its deployments dev and prod
    # throughout - backend-prod.spot-ship-app.com, flower-prod,
    # prod.spotship.internal.
    #
    # prod rather than dev: the bundled table must be what a customer's own
    # install will actually receive. The figures are static Decimals in
    # backend/insurance/rates.py rather than rows, so the two environments
    # agree for a given commit - but dev runs ahead of prod, and a release
    # should not bundle rates that are not live yet.
    #
    #   SPOTSHIP_API_URL = https://backend-prod.spot-ship-app.com/api
    environment: prod
    steps:
      # The TAG, not the caller's branch. semantic-release commits the version
      # bump and then tags it, so the branch tip and the tag are the same tree
      # only until the next merge — and building the branch would silently
      # produce a zip that is not the release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      # The header and the constant must agree before anything is built: the
      # update checker reads one and X-Plugin-Version reports the other. And
      # both must agree with the tag — EXPECTED_TAG carries that through the
      # workflow_call path, where GITHUB_REF_TYPE is the caller's ref and the
      # check would otherwise skip itself.
      - env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: bash bin/assert-version.sh

      - name: Generate the bundled fallback rate table
        # The repository ships an EMPTY table on purpose — these are
        # commercially approved figures and a hand-written placeholder would be
        # invented numbers on a customer's public site. The release fetches the
        # real one. A failure here is fatal rather than degraded: shipping a
        # silently empty table would remove the offline fallback without anyone
        # noticing.
        env:
          SPOTSHIP_API_URL: ${{ secrets.SPOTSHIP_API_URL }}
          SPOTSHIP_API_KEY: ${{ secrets.SPOTSHIP_API_KEY }}
        run: bash bin/generate-fallback-rates.sh

      - run: bash bin/build-dist.sh

      - uses: softprops/action-gh-release@v2
        with:
          # Named explicitly so the called path attaches to the release
          # semantic-release just made, rather than to the caller's ref.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.zip
          # Only when nothing else wrote them. semantic-release composes its own
          # notes from the conventional commits; letting this regenerate them
          # would overwrite that with GitHub's autogenerated list.
          generate_release_notes: ${{ inputs.tag == '' }}
