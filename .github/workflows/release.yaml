name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish the plugin zip
    runs-on: ubuntu-latest
    # DECLARING THE ENVIRONMENT IS WHAT MAKES THE SECRETS RESOLVE.
    #
    # SPOTSHIP_API_URL/KEY are environment secrets, not repository secrets:
    # the same two names hold the prod values here and the dev values in
    # real-backend-e2e.yaml. A job that does not name an environment sees only
    # repository and organisation secrets, so removing this line makes both
    # values empty and the rate fetch below fails.
    #
    # `prod`, not `production`: the org names its deployments dev and prod
    # throughout - backend-prod.spot-ship-app.com, flower-prod,
    # prod.spotship.internal.
    #
    # prod rather than dev: the bundled table must be what a customer's own
    # install will actually receive. The figures are static Decimals in
    # backend/insurance/rates.py rather than rows, so the two environments
    # agree for a given commit - but dev runs ahead of prod, and a release
    # should not bundle rates that are not live yet.
    #
    #   SPOTSHIP_API_URL = https://backend-prod.spot-ship-app.com/api
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      # The header and the constant must agree before anything is built: the
      # update checker reads one and X-Plugin-Version reports the other.
      - run: bash bin/assert-version.sh

      - name: Generate the bundled fallback rate table
        # The repository ships an EMPTY table on purpose — these are
        # commercially approved figures and a hand-written placeholder would be
        # invented numbers on a customer's public site. The release fetches the
        # real one. A failure here is fatal rather than degraded: shipping a
        # silently empty table would remove the offline fallback without anyone
        # noticing.
        env:
          SPOTSHIP_API_URL: ${{ secrets.SPOTSHIP_API_URL }}
          SPOTSHIP_API_KEY: ${{ secrets.SPOTSHIP_API_KEY }}
        run: bash bin/generate-fallback-rates.sh

      - run: bash bin/build-dist.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
