name: Semantic release

# THE PIECE THAT WAS DECLARED AND NEVER INSTALLED.
#
# package.json has carried a `release` block — `main` releases, `dev`
# prereleases — since the repository was scaffolded, and nothing read it:
# semantic-release was in no devDependency and no workflow invoked it. The
# configuration described an automation that did not exist, which is worse than
# having none, because `.ship/TICKET.md` lists it as delivered and a reader of
# package.json would reasonably believe it.
#
# WHAT RUNS WHERE.
#
#   push to dev   -> prerelease   vX.Y.Z-dev.N
#   push to main  -> release      vX.Y.Z
#
# The version lives in spotship-war-insurance.php, twice, and nowhere else —
# package.json has no version field to bump, because this is a WordPress plugin
# and package.json exists only to carry this configuration. bin/set-version.sh
# writes both places and reads them back; bin/assert-version.sh then refuses any
# tag that disagrees with them.
#
# WHY THE ZIP IS BUILT BEFORE THE RELEASE IS PUBLISHED, IN THIS ONE JOB.
#
# The zip IS the product: customers install it, and the update checker fetches
# it from the release assets. A release published without its asset therefore
# breaks auto-update for every install, and it is NOT self-healing — a later
# semantic-release run sees that version as already released and will never
# retry it, so recovery is manual.
#
# So the build runs inside semantic-release's `prepare` step, via the exec
# plugin in package.json, and @semantic-release/github attaches dist/*.zip as
# part of creating the release. A failed rate fetch or a failed zip now aborts
# BEFORE the version commit, the tag and the release exist, and the next run
# retries cleanly from an unchanged repository.
#
# This is why the job declares `environment: prod` and sets up PHP: the build
# chain it now runs needs the prod rate credentials and a PHP binary, which
# previously lived in release.yaml. release.yaml still exists for building a zip
# against a tag by hand — a tag push, or a manual run naming one.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # One release at a time. Two overlapping runs would both compute "the next
  # version" from the same tag and race to create it.
  group: semantic-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Version, build and publish
    runs-on: ubuntu-latest
    # DECLARING THE ENVIRONMENT IS WHAT MAKES THE SECRETS RESOLVE.
    #
    # SPOTSHIP_API_URL/KEY are environment secrets, not repository secrets: the
    # same two names hold the prod values here and the dev values in
    # real-backend-e2e.yaml. A job that does not name an environment sees only
    # repository and organisation secrets, so removing this line makes both
    # values empty and the rate fetch fails.
    #
    # `prod`, not `production`: the org names its deployments dev and prod
    # throughout — backend-prod.spot-ship-app.com, flower-prod,
    # prod.spotship.internal.
    #
    # prod rather than dev even for a `dev` prerelease: the bundled table must be
    # what a customer's own install will actually receive. The figures are static
    # Decimals in backend/insurance/rates.py rather than rows, so the two
    # environments agree for a given commit — but dev runs ahead of prod, and a
    # release should not bundle rates that are not live yet.
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the whole history to find the last tag and
          # the commits since it. A shallow clone makes it believe every release
          # is the first one.
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # bin/generate-fallback-rates.sh shapes the fetched JSON with `php -r`,
      # and bin/build-dist.sh runs composer. Both are invoked from
      # semantic-release's prepare step below, so PHP has to be here rather than
      # only in release.yaml.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consumed by bin/generate-fallback-rates.sh inside `prepare`.
          SPOTSHIP_API_URL: ${{ secrets.SPOTSHIP_API_URL }}
          SPOTSHIP_API_KEY: ${{ secrets.SPOTSHIP_API_KEY }}
        run: npx semantic-release
