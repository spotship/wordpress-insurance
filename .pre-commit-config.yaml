exclude: '^vendor/|^node_modules/|^\.ship/|^dist/'
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # readme.txt is the WP.org format and is whitespace-sensitive; .pot
        # files are generated by bin/refresh-pot.sh and must not be hand-edited
        # — CI regenerates and diffs them, so a fixed-up byte fails that job.
        exclude: '^readme\.txt$|\.pot$'
      - id: end-of-file-fixer
        exclude: '\.pot$'
      - id: check-json
      - id: check-xml
        # The only XML here is phpcs.xml.dist / phpunit.xml.dist, and the hook's
        # default `types: [xml]` keys off the .xml extension, so without this it
        # silently checks nothing. `types` (not `types_or`) carries that default
        # and is ANDed with `files`, so both have to be widened.
        files: '\.xml(\.dist)?$'
        types: [file]
      - id: check-yaml
        args: ['--unsafe']
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: phpcs
        name: phpcs (WPCS + PHPCompatibilityWP)
        entry: bash bin/phpcs-hook.sh
        language: system
        types: [file]
        # Gated on .php so a docs- or config-only commit is not blocked on a
        # machine where the container fallback is unavailable.
        files: '\.php$'
        pass_filenames: true

      - id: workflow-shell
        name: workflow shell blocks parse
        entry: python bin/check-workflow-shell.py
        # `python`, not `system`: pre-commit.ci has no guarantee of PyYAML on
        # the host interpreter, and this hook is not in the `skip` list below
        # because — unlike phpcs — it needs neither PHP nor Docker and so can
        # genuinely run there.
        language: python
        additional_dependencies: [pyyaml]
        # The script walks every workflow itself, so a change to one is enough
        # to re-check them all.
        files: '^\.github/workflows/.*\.ya?ml$|^bin/check-workflow-shell\.py$'
        pass_filenames: false

ci:
  autoupdate_schedule: weekly
  # pre-commit.ci has neither PHP nor Docker, so it cannot run the local phpcs
  # hook. The `static` job in ci.yaml runs PHPCS on a real PHP runner instead, so
  # the check is not lost — it runs somewhere that can execute it.
  skip: [phpcs]
  submodules: false
