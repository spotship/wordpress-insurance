exclude: '^vendor/|^node_modules/|^\.ship/|^dist/'
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # readme.txt is the WP.org format and is whitespace-sensitive; .pot files
        # are generated by `wp i18n make-pot` and must not be hand-edited.
        exclude: '^readme\.txt$|\.pot$'
      - id: end-of-file-fixer
        exclude: '\.pot$'
      - id: check-json
      - id: check-xml
        # The only XML here is phpcs.xml.dist / phpunit.xml.dist, and the hook's
        # default `types: [xml]` keys off the .xml extension, so without this it
        # silently checks nothing. `types` (not `types_or`) carries that default
        # and is ANDed with `files`, so both have to be widened.
        files: '\.xml(\.dist)?$'
        types: [file]
      - id: check-yaml
        args: ['--unsafe']
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: phpcs
        name: phpcs (WPCS + PHPCompatibilityWP)
        entry: bash bin/phpcs-hook.sh
        language: system
        types: [file]
        # Gated on .php so a docs- or config-only commit is not blocked on a
        # machine where the container fallback is unavailable.
        files: '\.php$'
        pass_filenames: true

ci:
  autoupdate_schedule: weekly
  # pre-commit.ci has neither PHP nor Docker, so it cannot run the local phpcs
  # hook. The `static` job in ci.yaml runs PHPCS on a real PHP runner instead, so
  # the check is not lost — it runs somewhere that can execute it.
  skip: [phpcs]
  submodules: false
